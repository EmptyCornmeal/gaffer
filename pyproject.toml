[project]
name = "gaffer"
version = "0.1.0"
description = "FPL decision engine — projects points, plans transfers/captain/chips, explains the move."
# Floor 3.12 (PEP 695 generics, `datetime.UTC`); ceiling 3.15 because the pinned
# scientific stack has no wheels beyond it. 3.14 is the version actually tested
# — see .python-version, requirements.lock.txt and both workflows.
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28,<0.29",
    # numpy is used directly (backtest, histdata, scenarios, live). It arrived as
    # a pandas transitive and was never declared, which is how an undeclared
    # dependency survives: it is always already installed.
    "numpy>=2.1,<3",
    "pandas>=2.2,<4",
    # PuLP 4.0 removes `LpVariable(...)` construction and `PULP_CBC_CMD`, both of
    # which the solver uses on every run. The cap is deliberate; lifting it needs
    # a migration plus evidence that CBC/HiGHS still solve the same models.
    "pulp>=3.0,<4.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.16,<0.17", "pytest>=8.0,<10", "pyyaml>=6.0,<7", "packaging>=24"]
# pyyaml: workflow-structure tests. packaging: gaffer.deps specifier checking.
ai = ["anthropic>=0.69,<1"]  # floor for thinking={"adaptive"} + output_config effort
# The read-only local MCP interface (`python -m gaffer.mcp_server`). Optional:
# the pipeline, the site and every test outside tests/test_mcp_*.py run without
# it. Capped below 3 because the server API changed shape at 2.0.
mcp = ["mcp>=2.0,<3"]
# There is deliberately no `ml` extra. T-26 built a leakage-checked trained model
# on production-available features and it lost to the shipped heuristic on every
# decision metric at every horizon — see docs/MODEL-EVALUATION.md. scikit-learn
# and joblib were removed with it; tests/test_ml_removed.py keeps them out.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaffer = ["store/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: test is allowed to reach the live FPL API (see tests/conftest.py::_no_network)",
  # ADVISORY tests describe interface ergonomics, not correctness. They run in
  # CI and their failure is reported, but they do NOT gate publishing. On
  # 2026-09-01 an early-warning headroom assertion about an MCP response --
  # 1,107 bytes over a soft threshold, comfortably inside the client's real cap
  # -- blocked every data refresh for 26 hours, three days before a deadline.
  # A cosmetic budget on one consumer must never stop the product updating.
  # The HARD cap test is deliberately NOT advisory: breaching it makes a tool
  # unusable, which is correctness.
  "advisory: interface ergonomics; reported in CI but never blocks a publish",
]
