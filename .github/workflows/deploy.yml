name: Deploy Gaffer front-end

# Rebuild + deploy the Svelte site to GitHub Pages whenever the app or the
# published data changes. The Mac Mini pushes fresh data/ + web/public/data on a
# schedule; that push triggers this deploy.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches web/.nvmrc and package.json `engines`.
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Gate the build. `vite build` does NOT typecheck Svelte, so without this
      # step type and a11y regressions deploy freely.
      - name: Typecheck + a11y check
        run: npm run check
      # Build BEFORE the tests. `perf.test.ts` measures the real bundle in
      # `dist/`, and skips itself when there is nothing to measure — so in this
      # order the performance budgets were silently not enforced on any fresh
      # checkout, which is every CI run. Building first makes them a gate.
      - run: npm run build
      - name: Unit tests + performance budgets
        run: npm run test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
